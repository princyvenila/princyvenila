<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="1280" height="540" role="img" aria-labelledby="title desc">
<title id="title">Princy Venila — Data Analytics and Applied Machine Learning</title><desc id="desc">Animated dark developer banner with cycling data roles, chart visualization and a pink-haired anime character waving hello.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101426"/><stop offset=".55" stop-color="#0d0e16"/><stop offset="1" stop-color="#171026"/></linearGradient>
 <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset=".52" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
 <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#a78bfa" opacity=".18"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style><![CDATA[
 text{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:ui-monospace,Consolas,monospace}
 .fade{opacity:0;animation:rise .9s ease-out forwards}.d1{animation-delay:.2s}.d2{animation-delay:.45s}
 @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
 @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:.18}}
 @keyframes cycle{0%,27%{opacity:1;transform:translateY(0)}32%,100%{opacity:0;transform:translateY(-8px)}}
 @keyframes floatHi{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-6px) rotate(.6deg)}}
 @keyframes bubbleHi{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
 @keyframes sparkle{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
 .role{animation:cycle 12s linear infinite}.r2{animation-delay:-4s}.r3{animation-delay:-8s}
 .anime{transform-box:fill-box;transform-origin:50% 100%;animation:floatHi 4.3s ease-in-out infinite}
 .bubble{transform-box:fill-box;transform-origin:50% 100%;animation:bubbleHi 2.8s ease-in-out infinite}
 .spark{transform-box:fill-box;transform-origin:center;animation:sparkle 2.2s ease-in-out infinite}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}}
 ]]></style>
</defs>
<rect width="1280" height="540" rx="28" fill="url(#bg)"/><rect width="1280" height="540" rx="28" fill="url(#dots)"/>
<circle cx="1080" cy="80" r="200" fill="#a78bfa" opacity=".05"/><circle cx="950" cy="400" r="250" fill="#22d3ee" opacity=".04"/>
<rect x="1" y="1" width="1278" height="538" rx="27" fill="none" stroke="url(#aurora)" stroke-opacity=".7"/>
<path d="M36 80V36H80M1200 36h44v44M36 460v44h44M1200 504h44v-44" fill="none" stroke="#22d3ee" stroke-width="2" opacity=".75"/>
<g class="fade d1">
 <rect x="78" y="55" width="250" height="34" rx="17" fill="#12252d" stroke="#22d3ee" stroke-opacity=".5"/>
 <circle cx="98" cy="72" r="5" fill="#34d399"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
 <text x="113" y="77" fill="#b9f6ff" font-size="12" font-weight="700" letter-spacing="1.5">DATA · CURIOSITY · INSIGHT</text>
</g>
<g class="fade d1">
 <text x="80" y="150" fill="#aab2cb" font-size="23">Hi there, I’m</text>
 <text x="76" y="216" fill="#eceef6" font-size="53" font-weight="800" letter-spacing="-1.2">Princy Venila</text>
 <text x="79" y="274" fill="url(#aurora)" font-size="26" font-weight="800" filter="url(#glow)">Turning data into clear insights.</text>
 <rect x="79" y="301" width="8" height="34" rx="4" fill="#22d3ee"/>
 <g class="role"><text x="105" y="325" fill="#eceef6" font-size="23" font-weight="700">Data Analytics Explorer</text></g>
 <g class="role r2"><text x="105" y="325" fill="#eceef6" font-size="23" font-weight="700">Business Insights Builder</text></g>
 <g class="role r3"><text x="105" y="325" fill="#eceef6" font-size="23" font-weight="700">Applied ML Learner</text></g>
 <text x="79" y="371" fill="#aab2cb" font-size="17">Exploring customer patterns, business trends</text>
 <text x="79" y="395" fill="#aab2cb" font-size="17">and machine-learning approaches to risk.</text>
</g>
<g class="fade d2">
 <rect x="643" y="100" width="302" height="224" rx="18" fill="#111a2a" stroke="url(#aurora)" stroke-opacity=".7"/>
 <rect x="659" y="116" width="270" height="30" rx="8" fill="#1a2436"/>
 <circle cx="676" cy="131" r="4" fill="#f472b6"/><circle cx="691" cy="131" r="4" fill="#a78bfa"/><circle cx="706" cy="131" r="4" fill="#22d3ee"/>
 <text x="730" y="136" class="mono" font-size="11" fill="#dbe7f7">insight_dashboard.ipynb</text>
 <path d="M670 280H919M670 245H919M670 210H919M670 175H919" stroke="#2b3b52" stroke-width="1"/>
 <path d="M680 268L721 244L760 258L800 213L840 229L881 173L914 190" fill="none" stroke="url(#aurora)" stroke-width="3" filter="url(#glow)"/>
 <g fill="#22d3ee"><circle cx="721" cy="244" r="4"/><circle cx="800" cy="213" r="4"/><circle cx="881" cy="173" r="4"/></g>
 <g transform="translate(677 307)">
  <rect x="0" y="-25" width="22" height="25" rx="4" fill="#22d3ee"><animate attributeName="height" values="17;25;17" dur="2.2s" repeatCount="indefinite"/></rect>
  <rect x="34" y="-36" width="22" height="36" rx="4" fill="#a78bfa"><animate attributeName="height" values="28;36;28" dur="2.5s" repeatCount="indefinite"/></rect>
  <rect x="68" y="-20" width="22" height="20" rx="4" fill="#f472b6"><animate attributeName="height" values="15;24;15" dur="2.1s" repeatCount="indefinite"/></rect>
  <rect x="102" y="-43" width="22" height="43" rx="4" fill="#22d3ee"><animate attributeName="height" values="33;43;33" dur="2.6s" repeatCount="indefinite"/></rect>
 </g>
</g>
<g fill="none" stroke="#a78bfa" opacity=".38"><circle cx="1066" cy="255" r="182"><animate attributeName="r" values="182;192;182" dur="7s" repeatCount="indefinite"/></circle><circle cx="1066" cy="255" r="142" stroke-dasharray="4 8"><animateTransform attributeName="transform" type="rotate" from="0 1066 255" to="360 1066 255" dur="25s" repeatCount="indefinite"/></circle></g>
<g class="anime"><image x="930" y="126" width="280" height="343" preserveAspectRatio="xMidYMid meet" href="data:image/webp;base64,"/></g>
