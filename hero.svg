 <path d="M1015 81Q1015 68 1028 68H1171Q1184 68 1184 81V105Q1184 118 1171 118H1082L1064 134L1067 118H1028Q1015 118 1015 105Z" fill="#172133" stroke="url(#aurora)" stroke-width="1.7"/>
 <text x="1099" y="99" text-anchor="middle" fill="#eaf7ff" font-size="18" font-weight="800">Hi there!</text>
</g>
<g class="spark" fill="#22d3ee"><path d="M914 150l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/><circle cx="1218" cy="205" r="4"/></g>
<g class="spark" fill="#f472b6" style="animation-delay:.8s"><path d="M1200 330l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/><circle cx="919" cy="386" r="3"/></g>
<path d="M54 466H1226" stroke="#28354c"/><text x="54" y="493" fill="#a78bfa" font-size="11" font-weight="800" letter-spacing="2">DATA / BUSINESS / APPLIED ML</text><text x="1225" y="493" fill="#8391ad" font-size="11" text-anchor="end" class="mono">LEARN · ANALYZE · SHARE</text>
</svg>