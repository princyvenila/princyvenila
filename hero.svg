<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="1280" height="540" role="img" aria-labelledby="title desc">
<title id="title">Princy Venila — Data Analytics and Applied Machine Learning</title>
<desc id="desc">An animated midnight-glass portfolio banner with changing data roles, glowing charts, and a waving illustrated analyst.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101426"/><stop offset=".55" stop-color="#0d0e16"/><stop offset="1" stop-color="#171026"/></linearGradient>
 <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset=".52" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
 <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#142a3a"/><stop offset="1" stop-color="#241636"/></linearGradient>
 <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#a78bfa" opacity=".18"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style><![CDATA[
  text{font-family:Inter,Segoe UI,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
  .fade{opacity:0;animation:rise .9s ease-out forwards}
  .d1{animation-delay:.15s}.d2{animation-delay:.4s}.d3{animation-delay:.65s}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:.18}}
  @keyframes sweep{0%{transform:translateX(-360px);opacity:0}15%{opacity:.6}75%{opacity:.15}100%{transform:translateX(520px);opacity:0}}
  @keyframes roleCycle{0%,27%{opacity:1;transform:translateY(0)}32%,100%{opacity:0;transform:translateY(-8px)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .role{animation:roleCycle 12s linear infinite}.r2{animation-delay:-4s}.r3{animation-delay:-8s}
  .cursor{animation:blink 1s steps(2,end) infinite}
  .float{animation:float 5s ease-in-out infinite}
  .sweep{animation:sweep 7s ease-in-out infinite}
  @keyframes wave{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(22deg)}}
  .wavearm{transform-box:fill-box;transform-origin:20% 85%;animation:wave 1.5s ease-in-out infinite}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
 ]]></style>
</defs>
<rect width="1280" height="540" rx="28" fill="url(#bg)"/>
<rect width="1280" height="540" rx="28" fill="url(#dots)"/>
<circle cx="1080" cy="80" r="200" fill="#a78bfa" opacity=".05"/>
<circle cx="950" cy="400" r="250" fill="#22d3ee" opacity=".04"/>
