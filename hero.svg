 <g transform="translate(779 306)">
  <rect x="0" y="-29" width="22" height="29" rx="4" fill="#22d3ee" opacity=".85"><animate attributeName="height" values="20;29;20" dur="2.2s" repeatCount="indefinite"/></rect>
  <rect x="34" y="-40" width="22" height="40" rx="4" fill="#a78bfa" opacity=".9"><animate attributeName="height" values="32;40;32" dur="2.5s" repeatCount="indefinite"/></rect>
  <rect x="68" y="-21" width="22" height="21" rx="4" fill="#f472b6" opacity=".9"><animate attributeName="height" values="18;28;18" dur="2.1s" repeatCount="indefinite"/></rect>
  <rect x="102" y="-48" width="22" height="48" rx="4" fill="#22d3ee" opacity=".7"><animate attributeName="height" values="38;48;38" dur="2.6s" repeatCount="indefinite"/></rect>
 </g>
</g>
<g class="float">
 <circle cx="1120" cy="190" r="92" fill="#a78bfa" opacity=".06"/>
 <circle cx="1120" cy="190" r="77" fill="none" stroke="#a78bfa" stroke-opacity=".5"><animate attributeName="r" values="77;87;77" dur="7s" repeatCount="indefinite"/></circle>
