 <path d="M1093 295L1110 315L1128 295" fill="#22d3ee" opacity=".8"/>
</g>
<g fill="#a78bfa"><circle cx="716" cy="420" r="4"><animate attributeName="opacity" values=".3;1;.3" dur="2.7s" repeatCount="indefinite"/></circle><circle cx="1191" cy="386" r="5"><animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite"/></circle></g>
