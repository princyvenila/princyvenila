<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
<title id="title">About my work and the ideas behind it</title><desc id="desc">An animated overview of Princy's analytics projects, data workflow and professional interests.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111727"/><stop offset="1" stop-color="#0d0e16"/></linearGradient></defs>
<rect width="1280" height="440" rx="25" fill="url(#bg)"/>
<text x="38" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="2.4" fill="#a78bfa">A LITTLE ABOUT THIS SPACE</text>
<text x="38" y="88" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#fff6ff">A portfolio shaped by questions, not just charts.</text>
<text x="38" y="122" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#d8c8e3">I explore datasets, find patterns, and turn analysis into clear, useful takeaways.</text>
<g font-family="Segoe UI,Arial,sans-serif">
 <rect x="38" y="158" width="375" height="226" rx="20" fill="#121b2b" stroke="#35415b"/>
 <text x="66" y="194" font-size="12" letter-spacing="2" fill="#22d3ee">HOW I APPROACH DATA</text>
 <circle cx="71" cy="232" r="5" fill="#22d3ee"/><text x="91" y="237" font-size="19" font-weight="700" fill="#fff7ff">Ask better questions</text><text x="91" y="260" font-size="14" fill="#d7c8e2">Start with the problem and the data.</text>
 <circle cx="71" cy="294" r="5" fill="#a78bfa"/><text x="91" y="299" font-size="19" font-weight="700" fill="#fff7ff">Make patterns readable</text><text x="91" y="322" font-size="14" fill="#d7c8e2">Use exploration and clear visual stories.</text>
 <circle cx="71" cy="355" r="5" fill="#f472b6"/><text x="91" y="360" font-size="19" font-weight="700" fill="#fff7ff">Connect insight to action</text>
 <rect x="445" y="158" width="785" height="226" rx="20" fill="#111827" stroke="#68507a"/>
 <text x="475" y="194" font-size="12" letter-spacing="2" fill="#22d3ee">FROM RAW DATA TO INSIGHT</text>
 <text x="475" y="222" font-size="15" fill="#d9cbe4">A repeatable workflow for analytics and applied machine learning.</text>
</g>
<g transform="translate(490 244)">
 <path d="M70 44H205 M260 44H395 M450 44H585" fill="none" stroke="#9469ad" stroke-width="2" stroke-dasharray="4 7"><animate attributeName="stroke-dashoffset" values="0;-44" dur="3s" repeatCount="indefinite"/></path>
 <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
  <rect x="0" y="0" width="140" height="72" rx="14" fill="#3c2b4c" stroke="#9469ad"/><text x="70" y="29" font-size="15" font-weight="700" fill="#fff6ff">Explore</text><text x="70" y="50" font-size="12" fill="#d9c5e6">Understand data</text>
  <rect x="185" y="0" width="140" height="72" rx="14" fill="#3c2b4c" stroke="#a16c95"/><text x="255" y="29" font-size="15" font-weight="700" fill="#fff6ff">Analyze</text><text x="255" y="50" font-size="12" fill="#d9c5e6">Find patterns</text>
  <rect x="370" y="0" width="140" height="72" rx="14" fill="#3c2b4c" stroke="#9e8659"/><text x="440" y="29" font-size="15" font-weight="700" fill="#fff6ff">Visualize</text><text x="440" y="50" font-size="12" fill="#d9c5e6">Tell the story</text>
  <rect x="555" y="0" width="140" height="72" rx="14" fill="#3c2b4c" stroke="#6a987b"/><text x="625" y="29" font-size="15" font-weight="700" fill="#fff6ff">Apply</text><text x="625" y="50" font-size="12" fill="#d9c5e6">Support decisions</text>
 </g>
 <g fill="#f1a4c1"><circle cx="42" cy="-12" r="4"><animate attributeName="cy" values="-12;-5;-12" dur="2.7s" repeatCount="indefinite"/></circle><circle cx="320" cy="92" r="3"><animate attributeName="opacity" values=".3;1;.3" dur="2.5s" repeatCount="indefinite"/></circle><circle cx="642" cy="-12" r="4"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle></g>
</g>
</svg>