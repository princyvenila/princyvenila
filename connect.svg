<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="title desc">
<title id="title">Let's connect</title><desc id="desc">An animated closing section inviting collaboration and linking to Princy's GitHub work.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111727"/><stop offset="1" stop-color="#0d0e16"/></linearGradient></defs><rect width="1280" height="470" rx="25" fill="url(#bg)" stroke="#35415b" stroke-width="1.5"/>
<text x="64" y="72" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="2.4" fill="#22d3ee">THANKS FOR STOPPING BY</text>
<text x="64" y="132" font-family="Segoe UI,Arial,sans-serif" font-size="39" font-weight="700" fill="#fff7ff">Good work starts with a good conversation.</text>
<text x="66" y="176" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#dac9e2">Ideas, thoughtful feedback, and learning together are always welcome.</text>
<g transform="translate(1020 250)" fill="none" stroke="#a78bfa">
 <circle r="104" stroke-dasharray="3 10" opacity=".65"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/></circle>
 <circle r="76" stroke-width="1.3"><animate attributeName="r" values="76;85;76" dur="5s" repeatCount="indefinite"/></circle>
 <ellipse rx="130" ry="48" transform="rotate(-32)"><animateTransform attributeName="transform" type="rotate" from="-32" to="328" dur="27s" repeatCount="indefinite"/></ellipse>
 <circle r="48" fill="#121b2b" stroke="#a78bfa" stroke-width="2"/>
 <path d="M-15 -3q15 -20 30 0M-15 15q15 12 30 0" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
 <circle cx="0" cy="3" r="5" fill="#f472b6" stroke="none"><animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/></circle>
</g>
<g fill="#a78bfa"><circle cx="887" cy="135" r="4"><animate attributeName="opacity" values=".25;1;.25" dur="2.5s" repeatCount="indefinite"/></circle><circle cx="1161" cy="349" r="5"><animate attributeName="r" values="3;6;3" dur="2.8s" repeatCount="indefinite"/></circle></g>
<path d="M952 118h28m-14 -14v28M1154 404h25m-12 -12v25" stroke="#f472b6" stroke-width="2"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></path>
<text x="66" y="424" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="2" fill="#d8c4e1">STAY CURIOUS · KEEP BUILDING</text>
</svg>