<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="235" viewBox="0 0 1200 235" role="img" aria-labelledby="t d">
<title id="t">A portfolio shaped by questions</title><desc id="d">Animated highlights about asking better questions, making patterns readable, and connecting insight to action.</desc>
<defs><linearGradient id="b" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#281b38"/><stop offset="1" stop-color="#34203b"/></linearGradient></defs>
<rect width="1200" height="235" rx="22" fill="url(#b)"/>
<text x="34" y="32" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="2.2" fill="#dda6ef">A LITTLE ABOUT THIS SPACE</text>
<text x="34" y="66" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#fff5ff">A portfolio shaped by questions, not just charts.</text>
<g font-family="Segoe UI,Arial,sans-serif">
 <rect x="34" y="88" width="354" height="116" rx="17" fill="#31243f" stroke="#80519a"/>
 <circle cx="65" cy="119" r="17" fill="#76528c"><animate attributeName="r" values="17;19;17" dur="3s" repeatCount="indefinite"/></circle><path d="M56 119h18M65 110v18" stroke="#f7eaff" stroke-width="2" stroke-linecap="round"/>
 <text x="92" y="118" font-size="16" font-weight="700" fill="#fff7ff">Ask better questions</text>
 <text x="56" y="151" font-size="13" fill="#d9c9e2">Start with a real-world problem,</text><text x="56" y="170" font-size="13" fill="#d9c9e2">then decide what the data can tell us.</text>
 <rect x="423" y="88" width="354" height="116" rx="17" fill="#31243f" stroke="#8e5a8d"/>
 <circle cx="454" cy="119" r="17" fill="#70445f"><animate attributeName="r" values="17;19;17" dur="3s" begin=".7s" repeatCount="indefinite"/></circle><path d="M444 127v-9h5v9m3 0v-15h5v15m3 0v-6h5v6" fill="none" stroke="#f7eaff" stroke-width="2" stroke-linecap="round"/>
 <text x="481" y="118" font-size="16" font-weight="700" fill="#fff7ff">Make patterns readable</text>
 <text x="445" y="151" font-size="13" fill="#d9c9e2">Use careful analysis and visual stories</text><text x="445" y="170" font-size="13" fill="#d9c9e2">to make results easier to understand.</text>
 <rect x="812" y="88" width="354" height="116" rx="17" fill="#31243f" stroke="#9b8158"/>
 <circle cx="843" cy="119" r="17" fill="#66513d"><animate attributeName="r" values="17;19;17" dur="3s" begin="1.4s" repeatCount="indefinite"/></circle><path d="M834 119h16m-7-7 7 7-7 7" fill="none" stroke="#ffeab0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="870" y="118" font-size="16" font-weight="700" fill="#fff7ff">Connect insight to action</text>
 <text x="834" y="151" font-size="13" fill="#d9c9e2">Explore performance, customer behavior,</text><text x="834" y="170" font-size="13" fill="#d9c9e2">and risk to support better decisions.</text>
</g>
<g fill="#f3a4c4"><circle cx="390" cy="81" r="2.5"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="793" cy="78" r="3"><animate attributeName="opacity" values="1;.25;1" dur="3.2s" repeatCount="indefinite"/></circle><circle cx="1175" cy="217" r="2"><animate attributeName="cy" values="217;211;217" dur="4s" repeatCount="indefinite"/></circle></g>
</svg>